<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>withyou – Console admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FAFCFD;--card:#FFFFFF;--ink:#1F2B24;--muted:#6B7A71;--line:#E6ECEA;
  --heading:#173A24;--green:#173A24;--green-2:#24523A;--on-green:#FFFFFF;
  --leaf:#3A9A5E;--leaf-bg:#EAF6EE;--sky1:#D3E9F2;--sky2:#F1F8FA;--soft:#EEF6F8;--cloud:rgba(255,255,255,.85);
  --warn:#9A6414;--warn-bg:#FBF0DA;--danger:#B23F36;--danger-bg:#F9E2DF;--info:#2B6982;--info-bg:#E4EFF4;--star:#D4A02F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400;color:var(--heading);margin:0}
h1{font-size:clamp(28px,3.2vw,40px);line-height:1.08}
h2{font-size:22px;line-height:1.2}
h3{font-size:18px;line-height:1.25}
img{max-width:100%}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

/* Layout */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:24px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:20px}
.wordmark{font-family:'DM Serif Display',Georgia,serif;font-size:30px;line-height:1;color:var(--heading);text-decoration:none;padding:0 10px}
.wordmark small{display:block;font-family:'Figtree',system-ui,sans-serif;font-size:12.5px;color:var(--muted);margin-top:6px}
.brandbox{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.brandbox b{display:block;font-size:14px;line-height:1.2}
.brandbox span{font-size:12px;color:var(--leaf);font-weight:600}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:'DM Serif Display',Georgia,serif;font-size:18px;color:#fff;background:#8E4B5A;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14.5px}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--soft);color:var(--heading);font-weight:600}
.nav svg{width:20px;height:20px;flex:none}
.nav .count{margin-left:auto;background:var(--leaf-bg);color:var(--heading);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding:14px;border-radius:16px;background:linear-gradient(180deg,var(--sky1),var(--sky2));font-size:13px;color:var(--ink)}
.side-foot b{display:block;font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:17px;color:var(--heading);margin-bottom:4px}
main{padding:24px clamp(16px,3vw,40px) 72px;min-width:0}
.wrap{max-width:1200px;margin:0 auto}
.wrap > * + *{margin-top:18px}

/* Page header: the withyou sky */
.head{position:relative;overflow:hidden;border-radius:28px;padding:36px 34px 30px;background:
  radial-gradient(55% 90% at 88% 0%,var(--cloud),transparent 62%),
  radial-gradient(35% 70% at 30% -10%,var(--cloud),transparent 70%),
  linear-gradient(180deg,var(--sky1),var(--sky2));
  display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head p{margin:10px 0 0;color:var(--muted);max-width:60ch}
.head .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--green);color:var(--on-green);padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--green-2)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.link{background:none;color:var(--heading);padding:4px 0;border-radius:0}
.btn.link:hover{text-decoration:underline}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Surfaces */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.panel .sub{color:var(--muted);font-size:13.5px;margin:4px 0 16px;max-width:70ch}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.story{padding:30px 30px 26px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.story p{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(22px,2.4vw,31px);line-height:1.28;color:var(--heading);margin:0;max-width:34ch}
.story .meta{color:var(--muted);margin-top:12px;font-size:14px;max-width:62ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .d{font-size:12.5px;color:var(--leaf);font-weight:600}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.chart{width:100%;height:210px;display:block}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}

/* Pills, fit bar */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--leaf-bg);color:var(--leaf)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.fit{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--leaf);white-space:nowrap}
.fit i{display:block;width:60px;height:6px;border-radius:9px;background:var(--leaf-bg);overflow:hidden}
.fit i b{display:block;height:100%;background:var(--leaf);border-radius:9px}
.fit.none{color:var(--muted);font-weight:500}

/* Tables */
.tbl-wrap{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prod{display:flex;align-items:center;gap:12px;min-width:250px}
.thumb{width:48px;height:48px;border-radius:12px;overflow:hidden;flex:none;background:var(--bg)}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.prod b{display:block;font-weight:600;line-height:1.3}
.prod span{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}

/* Controls */
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--soft);color:var(--heading);border-color:#B9D8E4;font-weight:600}
.tab small{opacity:.75;margin-left:4px}
.search{position:relative;min-width:240px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{padding-left:36px !important}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field > label,.lbl{font-weight:600;font-size:13.5px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.45}
.err{color:var(--danger);font-size:12.5px;font-weight:600}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:100px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--leaf-bg);border-color:var(--leaf);color:var(--heading);font-weight:600}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--bg);font-size:13.5px}
.drop:hover{border-color:var(--leaf);color:var(--ink)}
.drop svg{width:22px;height:22px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.counter{font-size:12px;color:var(--muted);text-align:right}

/* Editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.editor .panel + .panel{margin-top:16px}
.step{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--leaf-bg);color:var(--heading);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none;margin-top:2px}
.preview-col{position:sticky;top:20px}
.preview-col .cap{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.phone{width:330px;max-width:100%;margin:0 auto;border-radius:46px;background:#E9EEF0;border:1px solid #D6DEE2;padding:10px;box-shadow:0 30px 60px -30px rgba(40,80,95,.35)}
.screen{border-radius:37px;overflow:hidden;height:660px;overflow-y:auto;scrollbar-width:none;position:relative}
.screen::-webkit-scrollbar{display:none}
.notch{position:sticky;top:0;height:0;z-index:5}
.notch::before{content:"";position:absolute;left:50%;top:9px;transform:translateX(-50%);width:92px;height:26px;border-radius:20px;background:#1b1f1d}
.coverbox{display:grid;grid-template-columns:1fr 120px;gap:12px}
.coverprev{border-radius:16px;overflow:hidden;height:130px;background-size:cover;background-position:center;border:1px solid var(--line);position:relative}
.coverprev .acts{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.logoprev{width:120px;height:130px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--bg);position:relative;font-size:12.5px;color:var(--muted);text-align:center;padding:8px}
.logoprev .avatar{width:58px;height:58px;font-size:24px}
.logoprev input{position:absolute;inset:0;opacity:0;cursor:pointer}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.preset{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;background:var(--card);cursor:pointer;font-size:13px}
.preset:hover{border-color:var(--muted)}
.preset[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-bg);font-weight:600}
.sw{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.colorf{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--bg)}
.colorf input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer;flex:none;border-radius:8px}
.colorf input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.colorf input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.1);border-radius:8px}
.colorf input[type=text]{border:0;background:transparent;padding:4px;font-variant-numeric:tabular-nums;min-width:0;box-shadow:none}
.contrast{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:10px 12px;border-radius:12px;background:var(--leaf-bg);color:var(--heading);margin-top:14px}
.contrast svg{width:18px;height:18px;flex:none;margin-top:1px}
.contrast.bad{background:var(--warn-bg);color:var(--warn)}
.founder{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--danger);border-color:var(--danger)}
.iconbtn svg{width:16px;height:16px}
.keepnote{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:linear-gradient(180deg,var(--sky1),var(--sky2));font-size:13.5px}
.keepnote svg{width:20px;height:20px;flex:none;color:var(--heading);margin-top:2px}

/* Brand page preview (inside the phone) */
.pv{background:var(--pb);color:var(--pt);min-height:100%;font-family:'Figtree',system-ui,sans-serif}
.pv-cover{height:230px;background-size:cover;background-position:center;position:relative}
.pv-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--pb))}
.pv-body{padding:0 18px 28px;margin-top:-40px;position:relative;z-index:1}
.pv-logo{width:66px;height:66px;border-radius:50%;background:#fff;border:3px solid var(--pb);display:grid;place-items:center;overflow:hidden;font-family:'DM Serif Display',Georgia,serif;font-size:28px;color:var(--pa)}
.pv-logo img{width:100%;height:100%;object-fit:cover}
.pv h2{font-size:27px;color:var(--pt);margin-top:10px;line-height:1.1}
.pv h3{font-size:18px;color:var(--pa);margin:24px 0 8px}
.pv.sans h2,.pv.sans h3{font-family:'Figtree',system-ui,sans-serif;font-weight:700;letter-spacing:-.015em}
.pv p{font-size:13px;line-height:1.6;margin:0}
.pv-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:6px}
.seal{display:inline-flex;align-items:center;gap:4px;background:#fff;color:#173A24;border-radius:999px;padding:2px 9px 2px 6px;font-weight:700;font-size:11px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seal svg{width:12px;height:12px}
.pv .more{color:var(--pa);font-weight:700;font-size:12.5px;margin-top:6px;display:inline-block}
.audio{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 10px;border-radius:999px;border:1px solid var(--pa);font-size:11.5px}
.audio .play{width:26px;height:26px;border-radius:50%;background:var(--pa);display:grid;place-items:center;flex:none}
.audio .play::before{content:"";border-left:8px solid var(--pb);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.audio .wave{flex:1;height:14px;background:repeating-linear-gradient(90deg,var(--pa) 0 2px,transparent 2px 5px);opacity:.45;border-radius:3px}
.faces{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.face{width:112px;flex:none;font-size:12px}
.face .ph{height:132px;border-radius:16px;background:var(--pa);display:grid;place-items:center;font-family:'DM Serif Display',Georgia,serif;font-size:34px;color:var(--pb);margin-bottom:6px}
.face b{display:block;line-height:1.25}
.pv-chips{display:flex;flex-wrap:wrap;gap:6px}
.pv-chips span{border:1px solid var(--pa);color:var(--pa);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600}
.pv-prods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:#fff;color:#17261C;border-radius:16px;padding:8px;font-size:11.5px;border:1px solid rgba(0,0,0,.06);font-family:'Figtree',system-ui,sans-serif}
.pcard .img{aspect-ratio:1;border-radius:12px;overflow:hidden;background:#F2F4F1}
.pcard .img svg,.pcard .img img{width:100%;height:100%;display:block;object-fit:cover}
.pcard .n{font-weight:600;margin:7px 2px 4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.pcard .pr{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;gap:6px}
.pcard .pr strong{font-size:12px}
.pcard .fit i{width:34px}
.pcard .fit{color:#3A9A5E;font-size:11px}
.pcard .fit i{background:#E2F2E7}.pcard .fit i b{background:#3A9A5E}
.pcard .keep{display:block;text-align:center;background:#173A24;color:#fff;border-radius:999px;padding:7px;font-weight:600;font-size:11px}
.pcard.lg{font-size:13px;padding:10px}
.pcard.lg .n{font-size:13.5px;min-height:36px}
.pcard.lg .pr strong{font-size:14px}

/* Home */
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--bg);flex:none;color:var(--heading)}
.todo .ic svg{width:18px;height:18px}
.todo .t{flex:1;min-width:0}
.todo .t b{display:block;font-size:14px;line-height:1.3}
.todo .t span{font-size:12.5px;color:var(--muted)}

/* Analytics */
.bars .b{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:10px;font-size:13.5px;margin-bottom:11px}
.track{height:10px;border-radius:9px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.track b{display:block;height:100%;background:var(--leaf);border-radius:9px}
.funnel .f{margin-bottom:12px}
.funnel .f .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.funnel .f .top b{font-variant-numeric:tabular-nums}
.funnel .f .bar{height:30px;border-radius:10px;background:var(--leaf-bg);position:relative;overflow:hidden}
.funnel .f .bar b{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:10px;opacity:.85}
.funnel .drop-rate{font-size:12px;color:var(--muted);margin:-4px 0 10px 2px}
.queries{list-style:none;margin:0;padding:0}
.queries li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.queries li:last-child{border-bottom:0}
.insight{display:flex;gap:14px;padding:18px;border-radius:18px;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.insight svg{width:22px;height:22px;flex:none;color:var(--heading);margin-top:2px}
.insight p{margin:0 0 10px;font-size:14px}

/* Reviews */
.rating{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.rating .score{font-family:'DM Serif Display',Georgia,serif;font-size:56px;line-height:1;color:var(--heading)}
.stars{color:var(--star);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}
.review{padding:18px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}
.review .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.review .who{display:flex;gap:10px;align-items:center}

.slot .price{font-weight:700;font-size:15px}
.slot .reach{font-size:13px;color:var(--muted)}

.test{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.quote{font-family:'DM Serif Display',Georgia,serif;font-size:19px;line-height:1.35;color:var(--heading);margin:12px 0 0;max-width:46ch}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.facts b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}

.overlay{position:fixed;inset:0;background:rgba(10,22,15,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(800px,100%);background:var(--card);z-index:41;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border-left:1px solid var(--line)}
.drawer.open{transform:none}
.dhead{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}

.dbody{padding:22px 24px;overflow-y:auto;flex:1}
.dfoot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}

.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:26px;align-items:start}
.dgrid .aside{position:sticky;top:0}

.sec-t .n{width:24px;height:24px;border-radius:50%;background:var(--leaf-bg);display:grid;place-items:center;font-size:12px}

.x{border:0;background:var(--bg);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}

.photos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.photos .phx{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;background:var(--bg);border:1px solid var(--line)}
.photos .phx img{width:100%;height:100%;object-fit:cover;display:block}
.photos .phx .main{position:absolute;left:4px;bottom:4px;background:#fff;color:#173A24;font-size:10px;padding:1px 7px;border-radius:999px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#fff;color:var(--heading);border:1px solid var(--line);box-shadow:0 12px 30px -12px rgba(30,60,70,.25);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}

/* ---------------- Helpers ---------------- */
const head=(t,sub,act)=>`<header class="head"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div>${act?`<div class="actions">${act}</div>`:''}</header>`;
const blocked=()=>S.orders.filter(o=>o.block);
const rail=o=>`<div class="rail" aria-hidden="true">${STEPS.map((s,i)=>`<i class="${i<o.step||o.step===4?'done':i===o.step?(o.block?'block':'cur'):''}"></i>`).join('')}</div>`;
const railLg=o=>`<div class="raillg">${STEPS.map((s,i)=>`<div class="st ${i<o.step||o.step===4?'done':i===o.step?(o.block?'block':'cur'):''}"><i></i><span>${s}</span></div>`).join('')}</div>`;
let gid=0;
function series(n,base,seed){const a=[];for(let i=0;i<n;i++)a.push(Math.round(base*(1+.24*Math.sin(i/2.3+seed)+.12*Math.sin(i/5.1+seed*1.6)+.007*i)));return a}
function areaChart(v,h=220){const w=600,max=Math.max(...v)*1.12,n=v.length,X=i=>(i/(n-1)*w).toFixed(1),Y=x=>(h-x/max*h).toFixed(1);
 const d=v.map((x,i)=>(i?'L':'M')+X(i)+' '+Y(x)).join(' '),id='g'+(++gid);
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Évolution du volume de ventes"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--leaf);stop-opacity:.26"/><stop offset="1" style="stop-color:var(--leaf);stop-opacity:0"/></linearGradient></defs>${[.25,.5,.75].map(f=>`<line x1="0" x2="${w}" y1="${h*f}" y2="${h*f}" style="stroke:var(--line)" vector-effect="non-scaling-stroke"/>`).join('')}<path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#${id})"/><path d="${d}" fill="none" style="stroke:var(--leaf)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}
const bars=(rows,unit='%')=>`<div class="bars">${rows.map(r=>`<div class="b"><span>${r[0]}</span><span class="track"><b style="width:${r[1]}%"></b></span><span class="num">${r[1]} ${unit}</span></div>`).join('')}</div>`;
const initials=n=>esc(n.replace(/^Dr\s+/,'').split(' ').map(x=>x[0]).slice(0,2).join(''));
const kpis=(arr,cls='')=>`<div class="kpis ${cls}">${arr.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div>${k[2]?`<div class="d"${k[3]?` style="color:var(--${k[3]})"`:''}>${k[2]}</div>`:''}</div>`).join('')}</div>`;

 ${kpis([['Marques actives',S.brands.filter(b=>b.status==='active').length,'objectif : 50 au lancement'],['Artisans',S.brands.filter(b=>b.type==='Artisan').length],['Volume de ventes 30 j',fmt(S.brands.reduce((a,b)=>a+b.gmv,0))+' DZD'],['Retards de remise',S.brands.reduce((a,b)=>a+b.late,0),'sur 30 jours','warn']])}
 <section class="panel"><div class="toolbar"><div class="tabs">${F.map(x=>`<button class="tab${S.ui.bf===x[0]?' on':''}" data-action="bf" data-v="${x[0]}">${x[1]}<small>${S.brands.filter(b=>match(b,x[0])).length}</small></button>`).join('')}</div></div>
 <div class="tbl-wrap"><table><thead><tr><th>Marque</th><th>Type</th><th class="num">Produits</th><th class="num">Ventes 30 j</th><th class="num">Commission</th><th class="num">Note</th><th>Fiabilité</th><th>Statut</th><th></th></tr></thead><tbody>
 ${list.map(b=>`<tr><td><div class="prod" style="min-width:200px"><div class="avatar" style="background:#7FB8CF">${initials(b.name)}</div><div><b>${esc(b.name)}</b><span>${esc(b.city)}</span></div></div></td><td>${b.type}</td><td class="num">${b.prods}</td><td class="num">${fmt(b.gmv)} DZD</td><td class="num">${b.com} %</td><td class="num">${b.rating?String(b.rating).replace('.',','):'—'}</td><td>${b.late===0?'<span class="hp">À l\'heure</span>':b.late<3?`<span class="hp warn">${b.late} retard</span>`:`<span class="hp danger">${b.late} retards</span>`}</td><td>${BST[b.status]}</td><td class="num"><button class="btn ghost sm" data-action="brand" data-id="${b.id}">Ouvrir</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Aucune marque dans cette catégorie.</td></tr>'}
 </tbody></table></div></section></div>`;
}
function openBrand(id){
 const b=S.brands.find(x=>x.id===id);
 const body=`${b.note?`<div class="alertbox">${ic('alert')}<div><b>Motif de suspension</b>${esc(b.note)}</div></div>`:''}
 ${kpis([['Ventes 30 j',fmt(b.gmv)+' DZD'],['Produits',b.prods],['Retards de remise',b.late]],'k3')}
 <div class="sec" style="margin-top:18px"><div class="sec-t">Informations</div><div class="infogrid"><div><div class="k">Type</div>${b.type}</div><div><div class="k">Ville</div>${esc(b.city)}</div><div><div class="k">Contact</div>${esc(b.contact)}</div><div><div class="k">Note clientes</div>${b.rating?String(b.rating).replace('.',',')+' / 5':'Pas encore d\'avis'}</div></div></div>
 <div class="sec"><div class="sec-t">Commission</div><div class="field" style="max-width:220px"><label for="bcom">Commission sur les ventes (%)</label><input id="bcom" type="number" min="0" max="40" value="${b.com}"><span class="hint">Appliquée aux prochaines commandes. La marque est prévenue par e-mail.</span></div></div>`;
 const foot=`${b.status==='suspended'?`<button class="btn ghost" data-action="b-status" data-id="${b.id}" data-v="active">Réactiver la marque</button>`:b.status==='active'?`<button class="btn ghost" data-action="b-status" data-id="${b.id}" data-v="suspended">Suspendre la marque</button>`:''}<button class="btn" data-action="b-save" data-id="${b.id}">Enregistrer</button>`;
 openDrawer(esc(b.name),`${b.type}, ${esc(b.city)}`,body,foot);
}

/* ---------------- Salons ---------------- */
function renderSalons(){
 const f=S.ui.sf,list=S.salons.filter(s=>f==='all'||(f==='trained'&&s.trained)||(f==='todo'&&!s.trained));
 return `<div class="wrap">${head('Salons partenaires','Le réseau terrain : les salons recommandent withyou avec leur code, testent les produits et renvoient l\'avis de leurs clientes.','<button class="btn" data-action="toast" data-v="Invitation envoyée au salon.">'+ic('plus')+'Ajouter un salon</button>')}
 ${kpis([['Salons partenaires','64','objectif : 100'],['Formés',S.salons.filter(s=>s.trained).length+36,'sur 64'],['Recommandations 30 j','1 204','+18 %'],['Ventes générées 30 j','612 000 DZD']])}
 <section class="panel"><h2>Demandes de test des marques</h2><p class="sub">Envoyées depuis l'espace marque. Choisissez le salon qui correspond le mieux à la cible du produit.</p>
 ${S.testReq.length?S.testReq.map((t,i)=>`<div class="qitem"><div class="avatar">${initials(t.brand)}</div><div><b>${esc(t.prod)}</b><span class="m">${esc(t.brand)}, ${t.n} échantillons, wilaya : ${esc(t.wilaya)}</span></div><div class="assign"><select id="ts${i}" aria-label="Salon pour ${esc(t.prod)}">${S.salons.filter(s=>s.trained).map(s=>`<option>${esc(s.name)}, ${esc(s.wilaya)}</option>`).join('')}</select><button class="btn sm" data-action="assign-test" data-i="${i}">Attribuer</button></div></div>`).join(''):'<p class="empty">Aucune demande en attente.</p>'}</section>
 <section class="panel"><div class="toolbar"><div class="tabs">${[['all','Tous'],['trained','Formés'],['todo','À former']].map(x=>`<button class="tab${f===x[0]?' on':''}" data-action="sf" data-v="${x[0]}">${x[1]}</button>`).join('')}</div></div>
 <div class="tbl-wrap"><table><thead><tr><th>Salon</th><th>Wilaya</th><th>Code partenaire</th><th class="num">Recommandations 30 j</th><th class="num">Ventes générées</th><th>Formation</th><th></th></tr></thead><tbody>
 ${list.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="muted" style="font-size:12.5px">${s.type}</div></td><td>${esc(s.wilaya)}</td><td><code style="font-size:13px">${s.code}</code></td><td class="num">${s.reco}</td><td class="num">${fmt(s.sales)} DZD</td><td>${s.trained?'<span class="pill ok">Formé</span>':'<span class="pill warn">À former</span>'}</td><td class="num">${s.trained?'':`<button class="btn ghost sm" data-action="train" data-name="${esc(s.name)}">Planifier</button>`}</td></tr>`).join('')}
 </tbody></table></div></section></div>`;
}

/* ---------------- Spécialistes ---------------- */
function renderSpecialists(){
 const t=S.ui.pt,all=[...S.experts.map(e=>e.name),...S.creators.map(c=>c.name)];
 const cards=t==='experts'?S.experts.map(e=>`<section class="panel"><div class="person"><div class="avatar" style="background:#7FB8CF">${initials(e.name)}</div><div style="flex:1"><h3>${esc(e.name)}</h3><div class="role">${e.role}, ${e.city}</div><p>${e.mission}</p><div class="load${e.load>=85?' hi':''}"><div class="top"><span>Charge de travail</span><span>${e.load} %</span></div><div class="track"><b style="width:${e.load}%"></b></div></div><div class="mini"><div><b>${e.open}</b>missions ouvertes</div><div><b>${e.rating} / 5</b>note des marques</div><div><b style="font-size:13.5px">${e.avail}</b>disponibilités</div></div></div></div></section>`).join('')
 :S.creators.map(c=>`<section class="panel"><div class="person"><div class="avatar" style="background:#C9A3B0">${initials(c.name)}</div><div style="flex:1"><h3>${esc(c.name)}</h3><div class="role">${c.role}, ${c.city}</div><div class="mini"><div><b>${c.reach}</b>audience</div><div><b>${c.camp}</b>campagnes en cours</div><div><b style="font-size:13.5px">${c.brands}</b>marques</div></div></div></div></section>`).join('');
 return `<div class="wrap">${head('Spécialistes beauté','Les experts qui garantissent la qualité des conseils, et les créatrices formées qui racontent les marques.','<button class="btn" data-action="toast" data-v="Invitation envoyée.">'+ic('plus')+'Ajouter un spécialiste</button>')}
 <section class="panel"><h2>Missions à attribuer</h2><p class="sub">Dont les réponses que l'assistant IA a transmises faute d'être sûr de lui.</p>
 ${S.missions.map((m,i)=>`<div class="qitem"><div class="avatar" style="background:${m.to?'var(--leaf)':'#7FB8CF'}">${m.to?ic('check'):initials(m.type)}</div><div><b>${esc(m.t)}</b><span class="m">${m.type}, ${m.due}${m.to?`. Attribuée à ${esc(m.to)}`:''}</span></div>${m.to?'<span class="pill ok">Attribuée</span>':`<div class="assign"><select id="ms${i}" aria-label="Spécialiste pour ${esc(m.t)}">${(m.type==='Influence'?S.creators.map(c=>c.name):S.experts.map(e=>e.name)).map(n=>`<option>${esc(n)}</option>`).join('')}</select><button class="btn sm" data-action="assign-mission" data-i="${i}">Attribuer</button></div>`}</div>`).join('')}</section>
 <div class="tabs">${[['experts','Experts beauté'],['creators','Créatrices']].map(x=>`<button class="tab${t===x[0]?' on':''}" data-action="pt" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
 <div class="people">${cards}</div></div>`;
}

/* ---------------- Box ---------------- */
function renderBox(){
 const P={ok:'<span class="pill ok">Réuni</span>',short:'<span class="pill danger">Stock insuffisant</span>',wait:'<span class="pill warn">Sans réponse</span>'};
 return `<div class="wrap">${head('Box Rituel d\'octobre','Assemblage le 28 septembre, expédition à partir du 1er octobre. Une variante par type de peau.','')}
 ${kpis([['Abonnées actives','842','+46 ce mois'],['Jours avant assemblage','5','','warn'],['Produits réunis',S.boxItems.filter(x=>x.st==='ok').length+' sur '+S.boxItems.length],['Désabonnements','3,1 %','-0,4 point']])}
 <div class="grid g2"><section class="panel"><h2>Produits à réunir</h2><p class="sub">Besoin calculé à partir du nombre d'abonnées par type de peau.</p><div class="tbl-wrap"><table><thead><tr><th>Produit</th><th>Variantes</th><th class="num">Besoin</th><th class="num">Confirmé</th><th>État</th><th></th></tr></thead><tbody>
 ${S.boxItems.map((x,i)=>`<tr><td><b>${esc(x.p)}</b><div class="muted" style="font-size:12.5px">${esc(x.b)}</div></td><td>${x.v}</td><td class="num">${fmt(x.need)}</td><td class="num">${fmt(x.have)}</td><td>${P[x.st]}</td><td class="num">${x.st==='ok'?'':`<button class="btn ghost sm" data-action="box-remind" data-p="${esc(x.p)}">Relancer</button>`}</td></tr>`).join('')}
 </tbody></table></div></section>
 <section class="panel"><h2>Abonnées par variante</h2><p class="sub">Types de peau déclarés ou issus du scan.</p>${bars([['Peau mixte',38],['Peau sèche',24],['Peau grasse',21],['Peau sensible',17]])}</section></div>
 <section class="panel"><h2>Candidatures des marques</h2><p class="sub">Produits proposés depuis l'espace marque pour la box de novembre.</p>
 ${S.cands.map((c,i)=>`<div class="qitem"><div class="avatar">${initials(c.b)}</div><div><b>${esc(c.p)}</b><span class="m">${esc(c.b)}, pour : ${c.v}</span></div>${c.st==='new'?`<div class="assign"><button class="btn ghost sm" data-action="cand" data-i="${i}" data-v="no">Refuser</button><button class="btn sm" data-action="cand" data-i="${i}" data-v="yes">Retenir</button></div>`:c.st==='yes'?'<span class="pill ok">Retenue</span>':'<span class="pill mute">Refusée</span>'}</div>`).join('')}</section></div>`;
}

/* ---------------- Analyses ---------------- */
function renderAnalytics(){
 const per=S.ui.period,f={7:.24,30:1,90:2.9}[per];
 const lab={7:['17 sept.','20 sept.','23 sept.'],30:['25 août','8 sept.','23 sept.'],90:['26 juin','9 août','23 sept.']}[per];
 const funnel=[['Arrivées sur l\'app',12400],['Questionnaire terminé',7900],['Routine affichée',7600],['Produit gardé',2900],['Achat',1486]];
 return `<div class="wrap">${head('Analyses','La santé de la plateforme, la performance de l\'IA et la demande qui n\'est pas encore couverte.',`<div class="tabs">${[7,30,90].map(p=>`<button class="tab${per===p?' on':''}" data-action="period" data-v="${p}">${p} jours</button>`).join('')}</div>`)}
 ${kpis([['Volume de ventes',fmt(4212000*f)+' DZD','+14 %'],['Revenu withyou',fmt(712400*f)+' DZD','+17 %'],['Commandes',fmt(1486*f)],['Panier moyen','2 830 DZD','+4 %']])}
 <div class="grid g2"><section class="panel"><h2>Volume de ventes</h2><p class="sub">Toutes marques confondues, en dinars.</p>${areaChart(series(per,140000,1.3))}<div class="axis">${lab.map(l=>`<span>${l}</span>`).join('')}</div></section>
 <section class="panel"><h2>D'où vient le revenu</h2><p class="sub">Part de chaque source dans le revenu withyou.</p>${bars([['Commissions',68],['Box Rituel',21],['Placements',8],['Tests et influence',3]])}</section></div>
 <div class="grid g2e"><section class="panel"><h2>Parcours d'onboarding</h2><p class="sub">De l'arrivée à l'achat, sur ${per} jours.</p><div class="funnel">${funnel.map((s,i)=>`<div class="f"><div class="top"><span>${s[0]}</span><b>${fmt(s[1]*f)}</b></div><div class="bar"><b style="width:${(s[1]/funnel[0][1]*100).toFixed(1)}%"></b></div></div>${i<funnel.length-1?`<div class="drop-rate">${(funnel[i+1][1]/s[1]*100).toFixed(1).replace('.',',')} % passent à l'étape suivante</div>`:''}`).join('')}</div></section>
 <section class="panel"><h2>Performance de l'IA</h2><p class="sub">Les recommandations font-elles vendre mieux que la recherche classique ?</p>
 ${kpis([['Achats issus d\'une recommandation','62 %'],['Score moyen des produits achetés','89 %']],'k3" style="grid-template-columns:1fr 1fr')}
 <div style="margin-top:18px">${bars([['Recommandation IA',68],['Recherche classique',29]],'‰')}</div><p class="hint">Taux d'achat pour 1 000 produits affichés.</p>
 <div class="insight" style="margin-top:14px">${ic('bulb')}<div><p>Les clientes à peau sensible achètent 2 fois moins que la moyenne après leur routine. 3 produits recommandés n'ont pas de liste INCI complète.</p><a class="btn sm" href="#/validations">Voir les validations</a></div></div></section></div>
 <div class="grid g2e"><section class="panel"><h2>Ce qu'elles cherchent sans le trouver</h2><p class="sub">Recherches sans résultat : des marques à recruter.</p><ul class="queries">${[['SPF teinté',842],['shampoing sans sulfate',610],['déodorant naturel',455],['soin barbe',210],['huile de nigelle',188]].map(q=>`<li><span>« ${q[0]} »</span><span style="display:flex;gap:12px;align-items:center"><b class="num">${fmt(q[1]*f)}</b><button class="btn ghost sm" data-action="toast" data-v="Ajouté à la liste de marques à recruter : ${q[0]}.">Recruter</button></span></li>`).join('')}</ul></section>
 <section class="panel"><h2>Profils et wilayas</h2><p class="sub">Données agrégées de toutes les clientes.</p>${bars([['Mixte',38],['Sèche',24],['Grasse',21],['Sensible',17]])}<h3 style="margin:18px 0 12px">Wilayas</h3>${bars([['Alger',44],['Oran',13],['Tizi Ouzou',11],['Constantine',8],['Autres',24]])}</section></div>
 <div class="privacy">${ic('lock')}<div>Les profils de peau individuels restent internes à withyou. Les marques ne voient que des données agrégées sur au moins 20 clientes.</div></div></div>`;
}

/* ---------------- Drawer, toast ---------------- */
let lastFocus=null;
function openDrawer(t,sub,body,foot){lastFocus=document.activeElement;const d=$('#drawer');d.innerHTML=`<div class="dhead"><div><h2 id="dtitle">${t}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="x" data-action="close" aria-label="Fermer">${ic('x')}</button></div><div class="dbody">${body}</div><div class="dfoot">${foot}</div>`;d.classList.add('open');$('#overlay').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>{const b=d.querySelector('.x');b&&b.focus()},250)}
function closeDrawer(){$('#drawer').classList.remove('open');$('#overlay').classList.remove('open');document.body.style.overflow='';lastFocus&&lastFocus.focus&&lastFocus.focus()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}

/* ---------------- Nav & router ---------------- */
const NAV=[['jour','Vue du jour','home'],['commandes','Commandes','bag'],['livraisons','Livraisons','truck'],['validations','Validations','shield'],['marques','Marques','store'],['salons','Salons partenaires','scissors'],['specialistes','Spécialistes beauté','users'],['box','Box Rituel','gift'],['analyses','Analyses','chart']];
const R={jour:renderToday,commandes:renderOrders,livraisons:renderDeliveries,validations:renderValidations,marques:renderBrands,salons:renderSalons,specialistes:renderSpecialists,box:renderBox,analyses:renderAnalytics};
function renderNav(cur){const c={commandes:blocked().length,validations:S.queue.length,livraisons:S.orders.filter(o=>o.block&&(o.bt==='carrier'||o.bt==='client')).length};
 $('#nav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" class="${n[0]===cur?'on':''}"${n[0]===cur?' aria-current="page"':''}>${ic(n[2])}<span>${n[1]}</span>${c[n[0]]?`<span class="count">${c[n[0]]}</span>`:''}</a>`).join('')}
const cur=()=>{const r=location.hash.replace('#/','');return R[r]?r:'jour'};
function render(){const r=cur();main.innerHTML=R[r]();renderNav(r)}
window.addEventListener('hashchange',()=>{closeDrawer();render();window.scrollTo(0,0);main.focus({preventScroll:true})});

function resolve(id){const o=S.orders.find(x=>x.id===id);if(!o||!o.block)return;const msg={brand:`Relance envoyée à ${o.brands.find(b=>!b.ok)?.n||'la marque'}. Rappel automatique demain à 10 h.`,client:'Nouvelle tentative de livraison programmée demain. SMS envoyé à la cliente.',pay:'Paiement confirmé par la SATIM. Collecte lancée.',quality:'Remplacement reçu. La commande repart en emballage.',carrier:'Ticket ouvert chez '+o.carrier+'. Réponse attendue sous 24 h.'}[o.bt];
 if(o.bt==='pay'){o.step=1}if(o.bt==='brand'){o.brands.forEach(b=>b.ok=true);o.step=2}
 o.block=null;delete o.bt;save();closeDrawer();render();toast(msg)}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action,v=t.dataset.v,id=t.dataset.id;
 switch(a){
  case 'close':closeDrawer();break;
  case 'toast':toast(v);break;
  case 'of':S.ui.of=v;render();break;
  case 'of-blocked':S.ui.of='blocked';break;
  case 'bf':S.ui.bf=v;render();break;
  case 'sf':S.ui.sf=v;render();break;
  case 'pt':S.ui.pt=v;render();break;
  case 'period':S.ui.period=+v;render();break;
  case 'order':openOrder(id);break;
  case 'resolve':resolve(id);break;
  case 'refund':closeDrawer();toast(`Remboursement de ${id} demandé. Validation par la comptabilité sous 24 h.`);break;
  case 'call':toast('Appel lancé depuis le standard withyou.');break;
  case 'validate':openValidation(id);break;
  case 'v-fix':{const n=$('#vnote').value.trim();if(!n){$('#verr').textContent='Écrivez le message à la marque.';$('#vnote').focus();break}
   const q=S.queue.find(x=>x.id===id);S.queue=S.queue.filter(x=>x.id!==id);save();closeDrawer();render();toast(`Corrections demandées à ${q.brand}.`);break}
  case 'v-ok':{const q=S.queue.find(x=>x.id===id);S.queue=S.queue.filter(x=>x.id!==id);if(q.brandId){const b=S.brands.find(x=>x.id===q.brandId);if(b)b.status='active'}save();closeDrawer();render();toast(`Validé et publié : ${q.title}.`);break}
  case 'brand':openBrand(id);break;
  case 'b-save':{const b=S.brands.find(x=>x.id===id),c=+$('#bcom').value;if(!(c>=0&&c<=40)){toast('La commission doit être comprise entre 0 et 40 %.');break}b.com=c;save();closeDrawer();render();toast(`Commission de ${b.name} enregistrée : ${c} %.`);break}
  case 'b-status':{const b=S.brands.find(x=>x.id===id);b.status=v;if(v==='active')delete b.note;else b.note='Suspendue manuellement le 23 septembre';save();closeDrawer();render();toast(v==='active'?`${b.name} est réactivée.`:`${b.name} est suspendue. Ses produits sont masqués.`);break}
  case 'assign-test':{const i=+t.dataset.i,s=$('#ts'+i).value,r=S.testReq[i];S.testReq.splice(i,1);save();render();toast(`Test attribué à ${s.split(',')[0]}. ${r.brand} est prévenue.`);break}
  case 'train':toast(`Formation proposée à ${t.dataset.name} avec Sabrina Kaci.`);break;
  case 'assign-mission':{const i=+t.dataset.i;S.missions[i].to=$('#ms'+i).value;save();render();toast(`Mission attribuée à ${S.missions[i].to}.`);break}
  case 'box-remind':toast(`Relance envoyée pour ${t.dataset.p}.`);break;
  case 'cand':{const c=S.cands[+t.dataset.i];c.st=v;save();render();toast(v==='yes'?`${c.p} retenu pour la box de novembre.`:`Candidature refusée. ${c.b} est prévenue.`);break}
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('[data-chk]')){const all=[...document.querySelectorAll('[data-chk]')].every(x=>x.checked);const b=$('#vok');if(b)b.disabled=!all}
 if(t.id==='ocar'){const o=S.orders.find(x=>x.id===t.dataset.oid);o.carrier=t.value;save();render();toast(`Transporteur changé : ${t.value}.`)}
 if(t.dataset.actionChange==='rule')toast('Règle enregistrée pour les prochaines commandes.');
});
document.addEventListener('input',e=>{if(e.target.id==='oq'){S.ui.oq=e.target.value;$('#otable').innerHTML=orderRows()}if(e.target.id==='vnote'){const r=$('#verr');if(r)r.textContent=''}});
$('#overlay').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawer').classList.contains('open'))closeDrawer()});
render();
})();

</script>
</body>
