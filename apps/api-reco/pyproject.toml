[project]
name = "withyou-reco"
version = "0.1.0"
description = "WithYou recommendation service (cold-start content-based -> collaborative -> Learning-to-Rank)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal",
]

[tool.ruff]
line-length = 120
target-version = "py310"
