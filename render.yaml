# Render Blueprint — api-core (NestJS) sur l'offre gratuite.
# PostgreSQL : Neon · MongoDB : Atlas M0 (les URLs sont saisies dans le dashboard Render).
services:
  - type: web
    name: withyou-api-core
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @withyou/shared-utils build && pnpm --filter @withyou/api-core build
    startCommand: cd apps/api-core && pnpm exec prisma migrate deploy && node dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      # URL Vercel du front (CORS), ex. https://withyou.vercel.app
      - key: WEB_APP_URL
        sync: false
      # URL publique de ce service, ex. https://withyou-api-core.onrender.com
      - key: API_PUBLIC_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
